[project]
name = "meltdown"
version = "0.0.9"
authors = [{ name = "flofriday", email = "flohacksfriday@gmail.com" }]
description = "A markdown parser"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/flofriday/meltdown"
Issues = "https://github.com/flofriday/meltdown/issues"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["meltdown"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["venv", ".venv", "**/resources"]

[dependency-groups]
dev = [
    "inline-snapshot>=0.32.5",
    "pygments>=2.20.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "twine>=6.2.0",
    "ty>=0.0.26",
]
